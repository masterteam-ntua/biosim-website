home:
  eyebrow: Βιοϊατρική Τεχνολογία στο ΕΜΠ
  title: Εργαστήριο BIOSIM
  intro: Το Εργαστήριο Βιοϊατρικών Προσομοιώσεων και Απεικόνισης ιδρύθηκε το 1999 στο ΕΜΠ και το ΕΠΙΣΕΥ. Στόχος του είναι η μετατροπή τεχνολογιών αιχμής σε καινοτομία στην υγεία, με έμφαση στον διαβήτη και την παχυσαρκία, τα καρδιαγγειακά νοσήματα, την κινητή υγεία, τη νευροεπιστήμη και τα ευφυή συστήματα υγείας.
