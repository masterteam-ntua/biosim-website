research:
  intro: Η έρευνα του BIOSIM συνδέει την ηλεκτρολογία και τους υπολογιστές με βιοϊατρικές προσομοιώσεις, απεικόνιση, ασύρματη τηλεμετρία, κλινική υποστήριξη αποφάσεων και ευφυείς τεχνολογίες υγείας.
  areas: Ερευνητικές Περιοχές
  diploma_theses: Διπλωματικές Εργασίες
  phd_theses: Διδακτορικές Διατριβές
  diploma_intro: Διπλωματικές εργασίες που εκπονήθηκαν στο πλαίσιο των ερευνητικών δραστηριοτήτων του BIOSIM, ανά έτος.
  phd_intro: Διδακτορικές διατριβές που εκπονήθηκαν στο πλαίσιο των ερευνητικών δραστηριοτήτων του BIOSIM.
projects:
  intro: Ευρωπαϊκά και εθνικά χρηματοδοτούμενα έργα που συντονίζει ή συμμετέχει το BIOSIM.
people:
  intro: Το εργαστήριο αποτελείται από μέλη ΔΕΠ, ερευνητές, υποψήφιους διδάκτορες, συνεργάτες, επισκέπτες και αποφοίτους.
news:
