  summary_en: Intelligent multimodal framework for COVID-19 risk assessment and monitoring
    using explainable deep learning and audio biomarkers.
  summary_el: Πολυτροπικό πλαίσιο για εκτίμηση κινδύνου και παρακολούθηση COVID-19
    με εξηγήσιμη βαθιά μάθηση και ηχητικούς βιοδείκτες.
  slug: "smarty4covid"
  source_url: "https://www.biosim.ntua.gr/en/project/36"
  duration: "12/2021 - 12/2022"
  partners:
    - "ICCS NTUA"
    - "Evangelismos Hospital"
  framework: "HFRI"
  description_en: |
    The project aims at the development of an Intelligent Multimodal Framework for COVID-19 Risk Assessment and Monitoring based on Explainable Deep Learning. Multimodal deep learning techniques will be applied on heterogeneous data, consisting of self-reported risk factors, along with audio recordings of breathing, voice and speech, towards the discovery of novel biomarkers of infection and disease progression with the ultimate goal to (i) increase the sensitivity of the screening procedure by detecting cases with high risk of COVID-19 infection, (ii) enable the remote monitoring of patients with COVID-19, and (iii) provide alert signals in case of emergency.

    The project advances the current state of the art by initiating innovative clinical pilots involving hospitalized patients with COVID-19 through a strategic partnership with the AHEPA Hospital. It is expected that the application of AI on the heterogeneous data (e.g. medical history, laboratory exams, audio recordings of breath, speech and cough) that will be collected within the framework of the clinical pilots will produce new biomarkers of disease progression.

    Besides the version used within the clinical study under the supervision of healthcare professionals, smarty4covid has released a web-based application [smarty4covid](http://www.smarty4covid.org) to facilitate crowd sourcing data collection. This parallel study aims at the development of models able to predict the risk of COVID-19 infection and provide biomarkers for disease progression in infected non-hospitalized individuals.
- title_en: Cockpit Crew Health Monitoring
  status: completed
  title_el: Ανάπτυξη Συστήματος Παρακολούθησης της Κατάστασης Υγείας των Πιλότων Αεροσκαφών
    σε Πραγματικό Χρόνο
  tags:
    - biosignals
    - aviation
    - monitoring
  summary_en: Real-time monitoring of cockpit crew physiology with sensors and signal/image
    processing to support pilot incapacitation warnings.
  summary_el: Παρακολούθηση φυσιολογικών παραμέτρων πιλότων με αισθητήρες και επεξεργασία
    σημάτων/εικόνας για έγκαιρη προειδοποίηση.
  slug: "cockpit-crew-health-monitoring"
  source_url: "https://www.biosim.ntua.gr/en/project/33"
  duration: "01/2018 - 12/2021"
  partners:
    - "ICCS NTUA"
    - "Hellenic Aerospace Industry"
    - "National and Kapodistrian University of Athens"
    - "MOD/GDOSY/DIDEAP"
  framework: "ΕΣΠΑ 2014-2020"
  description_en: |
    Human factors are the principal cause of aircraft accidents, at a rate of 70 – 80%. Of these accidents, 10% are due to "disease" and the rest are due to "human error". "Pilot incapacitation" is the term used in the literature to describe the inability of a pilot, who is part of the operating crew, to carry out his flight duties, because of one or more factors which arise in flight and affect either human physiology (i.e. disease, hypoxia) or human performance (i.e. fatigue). The incapacitation can be physical or mental, acute or progressive, evident or latent. It is evident that acute and latent incapacitation is the most dangerous for the flight safety. The COCKPIT project aims to the "in flight" monitoring -in a flight simulator environment- of a set of human physiology parameters (heart rate, breath rate, hemoglobin oxygen saturation, muscle tone and sleepiness), by using specialized sensors and advanced signal and image processing techniques. In particular, COCKPIT's goal is to develop: (i) a real time "Cockpit Crew Health Monitoring System" and (ii) an "Early Warning System for the Second Pilot" so he resumes the control of the aircraft, thus minimizing the probability that an aircraft accident happens.
