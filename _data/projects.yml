- title_en: "DEEP-HEALTH: Strengthening Research Excellence and Innovation in Digital Health Across Widening Europe"
  slug: deep-health
  status: in_progress
  featured: true
  home_featured: true
  tags:
    - digital health
    - AI
    - precision oncology
  summary_en: Strengthening European research partnerships and capacity in AI-driven digital health, with joint work in precision oncology and mental health monitoring.
  summary_el: Ενίσχυση των ευρωπαϊκών ερευνητικών συνεργασιών στην ψηφιακή υγεία με ΤΝ, με κοινή έρευνα στην ογκολογία ακριβείας και την παρακολούθηση της ψυχικής υγείας.
  partners:
    - National Technical University of Athens (NTUA, Coordinator)
    - Fraunhofer
    - IDIBAPS–CERCA
    - Hospital Clínic de Barcelona (HCB)
    - Break Even
    - Leibniz University Hannover (LUH)
    - Brno University of Technology (BUT)
    - University of Brest (UBO)
    - Council of European BioRegions (CEBR)
    - CEITEC
  duration: 10/2026 – 09/2031
  framework: Horizon Europe – WIDERA (Excellence Hubs)
  description_en: |
    DEEP-HEALTH aims to strengthen research excellence and innovation capacity in AI-driven and data-enabled health technologies by establishing sustainable collaborations between higher education institutions in Widening and non-Widening European countries. The project focuses on enhancing scientific competitiveness, accelerating digital transformation, and modernizing institutional research and innovation practices through coordinated activities in research excellence, capacity building, infrastructure development, and interdisciplinary collaboration.

    A central objective of DEEP-HEALTH is the development of a joint Strategic Research and Innovation Agenda (SRIA) to identify common scientific priorities and foster long-term cooperation in AI-augmented HealthTech. The project will assess existing research and digital infrastructures, identify technological and institutional gaps, and promote the adoption of interoperable digital systems, FAIR data management practices, and responsible AI methodologies. Complementary activities will support institutional reform, researcher training, staff mobility, entrepreneurship, and engagement with healthcare organizations, industry, and policymakers.

    To translate these efforts into concrete scientific outcomes, DEEP-HEALTH will implement collaborative seed research and innovation activities focusing on precision oncology and mental health monitoring. These activities will investigate advanced multimodal AI methodologies integrating heterogeneous biomedical data, including medical imaging, molecular and clinical information, physiological signals, and data from wearable and connected medical devices. Particular emphasis will be placed on explainability, robustness, generalizability, and clinically meaningful validation, with the aim of supporting patient stratification, prognostic modelling, personalized disease monitoring, and the identification of clinically relevant digital biomarkers.

    Through the integration of institutional development, digital innovation, and clinically oriented collaborative research, DEEP-HEALTH is expected to strengthen the research capabilities and international visibility of participating institutions, establish sustainable HealthTech partnerships, and facilitate future joint research proposals, infrastructure investments, and innovation initiatives.
- title_en: "ResilientAI: An Integrated Framework for Detecting and Addressing Domain Shifts in Dynamic Data to Enhance the Robustness and Reliability of Machine Learning Models for Food Safety"
  slug: resilient-ai
  status: in_progress
  featured: true
  home_featured: true
  tags:
    - food safety
    - machine learning
    - domain shift
  summary_en: Adaptive and explainable AI for reliable food safety risk prediction as data and conditions change.
  summary_el: Προσαρμοστική και εξηγήσιμη ΤΝ για αξιόπιστη πρόβλεψη κινδύνων στην ασφάλεια τροφίμων υπό μεταβαλλόμενες συνθήκες.
  partners:
    - ICCS–NTUA (BioSim)
    - AGROKNOW
  duration: 11/2026 – 10/2029
  framework: Ερευνώ–Καινοτομώ | ΕΣΠΑ 2021-2027
  description_en: |
    ResilientAI aims to develop an intelligent framework for enhancing the robustness, reliability, and interpretability of machine learning models used for food safety risk prediction. The project addresses a fundamental challenge in the deployment of AI systems: the deterioration of predictive performance when models encounter evolving data distributions, known as domain shifts. By combining multimodal learning, continuous data monitoring, explainable AI, and adaptive machine learning, ResilientAI seeks to support reliable risk assessment and informed decision-making in the food supply chain.

    The project focuses on the development of advanced methodologies for integrating heterogeneous data sources, including historical food safety incidents, environmental conditions, agricultural practices, and supply chain information, to improve the prediction of emerging food safety risks. Particular emphasis is placed on the early detection and characterization of domain shifts, uncertainty quantification, and the generation of interpretable predictions. Novel domain adaptation and generalization strategies will be investigated to enable predictive models to maintain their performance under changing conditions, while providing insights into the factors influencing their predictions and potential corrective actions.

    The developed methodologies will be integrated into FOODAKAI, AGROKNOW's commercially available AI-powered food safety intelligence platform, and evaluated through representative use cases involving the prediction of food contamination risks, particularly those associated with mycotoxins and heavy metals. The project will also develop interactive tools that enable food safety professionals and data analysts to monitor model performance, understand detected distribution shifts, and support appropriate adaptation strategies.

    Through the collaboration between ICCS–NTUA and AGROKNOW, ResilientAI aims to bridge advanced AI research and industrial applications, contributing to more transparent, adaptive, and trustworthy decision-support systems for food safety. The project is expected to enhance the capacity to anticipate and mitigate emerging risks, strengthen food quality assurance practices, and ultimately contribute to the protection of public health.
